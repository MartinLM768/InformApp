<ion-header>
  <ion-toolbar color="primary">
    <ion-title>
      <ion-icon name="sparkles-outline"></ion-icon>
      Asistente InformApp
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()" color="light" aria-label="Cerrar asistente">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="chat-content">
  <div class="messages" aria-live="polite">
    <div
      *ngFor="let mensaje of mensajes"
      class="message"
      [class.user-message]="mensaje.autor === 'usuario'"
      [class.bot-message]="mensaje.autor === 'asistente'"
    >
      <span>{{ mensaje.texto }}</span>
    </div>

    <div class="message bot-message loading-message" *ngIf="procesando">
      <ion-spinner name="dots"></ion-spinner>
    </div>
  </div>

  <div class="suggestions" *ngIf="!procesando && mensajes[mensajes.length - 1]?.autor === 'asistente'">
    <ion-button fill="outline" size="small" (click)="usarPregunta('¿Qué hace un alcalde?')">
      ¿Qué hace un alcalde?
    </ion-button>
    <ion-button fill="outline" size="small" (click)="usarPregunta('¿Qué hace la rama Legislativa?')">
      Rama Legislativa
    </ion-button>
    <ion-button fill="outline" size="small" (click)="usarPregunta('¿Quién es el presidente?')">
      ¿Quién es el presidente?
    </ion-button>
  </div>
</ion-content>

<ion-footer>
  <ion-item lines="none" class="composer">
    <ion-input
      [(ngModel)]="pregunta"
      (keyup.enter)="enviarPregunta()"
      placeholder="Pregunta sobre cargos o políticos..."
      aria-label="Escribe una pregunta"
    ></ion-input>
    <ion-button
      slot="end"
      fill="clear"
      (click)="enviarPregunta()"
      [disabled]="!pregunta.trim() || procesando"
      aria-label="Enviar pregunta"
    >
      <ion-icon name="send-outline" slot="icon-only"></ion-icon>
    </ion-button>
  </ion-item>
</ion-footer>
